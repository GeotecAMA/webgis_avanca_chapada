<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plataforma Avança Chapada Bahia</title>
  <meta name="description" content="Plataforma de dados georreferenciados do território Chapada Diamantina, Bahia.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/style.css?v=20261010102236">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#mapa" aria-label="Início">
      <img src="assets/logo.svg" alt="" width="66" height="44">
      <span class="brand-text">
        <small>Plataforma</small>
        <strong>Avança Chapada</strong>
        <small class="uf">Bahia</small>
      </span>
    </a>
    <nav class="nav" id="nav">
      <a href="#mapa" data-page="mapa">Mapa</a>
      <a href="#glossario" data-page="glossario">Glossário</a>
      <a href="#contato" data-page="contato">Fale conosco</a>
    </nav>
    <a class="partner" href="https://www.senaicimatec.com.br" target="_blank" rel="noopener" title="SENAI CIMATEC">
      <img src="assets/senai-cimatec.png" alt="SENAI CIMATEC" height="30">
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </header>

  <main class="stage">
    <div id="map" aria-label="Mapa"></div>

    <form class="search" id="search" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar localização ou coordenada (ex: -12.56, -41.39)" aria-label="Buscar localização">
      <ul class="search-results" id="searchResults" hidden></ul>
    </form>

    <aside class="panel" id="panel" aria-label="Painel de camadas">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="camadas" role="tab">
          <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Camadas
        </button>
        <button class="tab" data-tab="base" role="tab">
          <svg viewBox="0 0 24 24"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa base
        </button>
      </div>
      <div class="tab-body" id="tab-camadas">
        <h2>Camadas</h2>
        <div id="topics"><p class="muted">Carregando camadas…</p></div>
        <button class="clear-btn" id="clearAll" type="button">Desligar todas</button>
        <button class="report-btn" id="btnReport" type="button">
          <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
          Relatório de vocação (PDF)
        </button>
      </div>
      <div class="tab-body" id="tab-base" hidden>
        <h2>Mapa base</h2>
        <div id="basemaps"></div>
      </div>
    </aside>

    <div class="toolbar" id="toolbar">
      <button id="tPanel" class="primary" title="Mostrar/ocultar camadas" aria-label="Mostrar ou ocultar camadas">
        <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>
      </button>
      <button id="tHome" title="Enquadrar o território" aria-label="Enquadrar o território">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button id="tIn" title="Aproximar" aria-label="Aproximar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/></svg>
      </button>
      <button id="tOut" title="Afastar" aria-label="Afastar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/></svg>
      </button>
      <button id="tReport" title="Relatório de vocação em PDF" aria-label="Relatório de vocação em PDF">
        <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
      </button>
      <button id="tLocate" title="Minha localização" aria-label="Minha localização">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
      </button>
    </div>

    <div class="status" id="status" hidden></div>

    <section class="page" id="page" hidden>
      <div class="page-inner" id="pageInner"></div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="conteudo.js?v=20261010102236"></script>
  <script src="assets/app.js?v=20261010102236"></script>
  <script src="assets/relatorio.js?v=20261010102236"></script>
</body>
</html>
